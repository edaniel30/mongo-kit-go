name: CI

on:
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: "1.26"
  COVERAGE_THRESHOLD: 85

jobs:
  test:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ env.GO_VERSION }}-

      - name: Download dependencies
        run: go mod download

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic $(go list ./... | grep -v /examples | grep -v /testing)

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          echo "Threshold: ${COVERAGE_THRESHOLD}%"
          if (( $(echo "$COVERAGE < $COVERAGE_THRESHOLD" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below threshold ${COVERAGE_THRESHOLD}%"
            exit 1
          fi
          echo "Coverage meets threshold"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          set +e
          output=$(govulncheck ./... 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ $code -eq 3 ]; then
            if echo "$output" | grep -v "Fixed in: N/A" | grep -q "Fixed in:"; then
              echo "::error::Vulnerabilities with available fixes found. Please update affected dependencies."
              exit 1
            else
              vulns=$(echo "$output" | grep "Vulnerability #" | sed 's/Vulnerability //')
              echo "::warning::Vulnerabilities found with no fix available yet: $vulns"
              exit 0
            fi
          fi
          exit $code